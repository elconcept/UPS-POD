# UPS POD – ustawienia
# Zmieniaj tylko wartości po znaku "=". Linie zaczynające się od # to komentarze.
# Ścieżki względne liczone są od folderu aplikacji (tam, gdzie leży ups_pod.py).

[PLIKI]
# Plik Excel z arkuszami DATA i CHECK.
# Windows przykład:  plik_excel = C:\Users\Jan\UPS_POD\apka.xlsx
# Mac przykład:      plik_excel = ~/UPS_POD/apka.xlsx
plik_excel = apka.xlsx

# Folder, w którym powstają foldery <DATA>-<Shipment ID> z plikami PDF.
folder_pdf = POD

[ARKUSZE]
arkusz_dane = DATA
arkusz_check = CHECK

[UPS]
# Produkcja: https://onlinetools.ups.com
# Środowisko testowe UPS (CIE): https://wwwcie.ups.com
adres_api = https://onlinetools.ups.com
jezyk = pl_PL
# Opcjonalnie: 6-znakowy numer Twojego konta UPS (wysyłany przy logowaniu jako x-merchant-id).
numer_konta =
# Odstęp między zapytaniami do UPS (sekundy).
przerwa_miedzy_zapytaniami_s = 0.3

[HARMONOGRAM]
# Dni: poniedzialek, wtorek, sroda, czwartek, piatek, sobota, niedziela (rozdziel przecinkiem).
# Po zmianie: menu → 5 (Włącz harmonogram), aby zapisać nowy termin w systemie.
dni = wtorek, czwartek
godzina = 15:00

[PLIK_OTWARTY]
# Jeśli plik Excel jest otwarty, aplikacja czeka na jego zamknięcie (minuty).
# Gdy nadal otwarty: PDF-y i tak są pobierane, a wyniki trafiają do dane/raporty/*.csv;
# arkusz CHECK uzupełni się przy następnym uruchomieniu.
czekaj_minut = 10
