name: ups-pod
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ups-pod-web:local
    container_name: ups-pod-web
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    env_file: /volume2/docker/ups-pod/.env
    environment:
      PUBLIC_HOST: ups.xlap.pl
      UPS_POD_HOME: /data
      TZ: Europe/Warsaw
      HOME: /tmp
    volumes:
      - /volume2/docker/ups-pod/data:/data
    tmpfs:
      - /tmp:size=128m,mode=1777
    networks: [cf_ups]
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8080/healthz',headers={'Host':'ups.xlap.pl'}),timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
  worker:
    image: ups-pod-web:local
    container_name: ups-pod-worker
    command: ["python","/app/worker.py"]
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    shm_size: 256m
    pids_limit: 256
    env_file: /volume2/docker/ups-pod/.env
    environment:
      UPS_POD_HOME: /data
      UPS_POD_RETRY_HOURS: "3"
      UPS_POD_POLL_SECONDS: "10"
      TZ: Europe/Warsaw
      HOME: /tmp
    volumes:
      - /volume2/docker/ups-pod/data:/data
    tmpfs:
      - /tmp:size=256m,mode=1777
    networks: [ups_outbound]
networks:
  cf_ups:
    external: true
  ups_outbound:
    driver: bridge
    ipam:
      config:
        - subnet: 172.16.12.32/28
