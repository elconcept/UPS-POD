name: ups-pod
services:
  init:
    image: busybox:1.37
    command: ["sh","-c","mkdir -p /data/pod /data/source && chown -R 10001:10001 /data  "]
    restart: "no"
    network_mode: none
    volumes:
      - /volume2/docker/ups-pod/data:/data
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    security_opt: ["no-new-privileges:true"]
  web:
    build:
      context: /volume2/docker/ups-pod
      dockerfile: Dockerfile
    image: ups-pod-web:local
    container_name: ups-pod-web
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    env_file: /volume2/docker/ups-pod/.env
    environment:
      PUBLIC_HOST: ups.xlap.pl
      UPS_POD_HOME: /data
      TZ: Europe/Warsaw
      HOME: /tmp
    volumes:
      - /volume2/docker/ups-pod/data:/data
    tmpfs:
      - /tmp:size=128m,mode=1777
    networks: [cf_ups]
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
  worker:
    image: ups-pod-web:local
    container_name: ups-pod-worker
    command: ["python","/app/worker.py"]
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    shm_size: 256m
    pids_limit: 256
    env_file: /volume2/docker/ups-pod/.env
    environment:
      UPS_POD_HOME: /data
      UPS_POD_RETRY_HOURS: "3"
      UPS_POD_POLL_SECONDS: "10"
      TZ: Europe/Warsaw
      HOME: /tmp
    volumes:
      - /volume2/docker/ups-pod/data:/data
    tmpfs:
      - /tmp:size=256m,mode=1777
    networks: [ups_outbound]
    depends_on:
      init:
        condition: service_completed_successfully
networks:
  cf_ups:
    external: true
  ups_outbound:
    driver: bridge
